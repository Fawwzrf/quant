name: Quant V6 Institutional Runner

on:
  workflow_dispatch:
  schedule:
    # Menjaga estafet sesi tetap hidup setiap 5 jam 30 menit
    - cron: '*/30 */5 * * *'

concurrency:
  group: quant-v6-production-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-quant-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Quant V6.0 (With 15m Live Git Sync)
        run: |
          python -u bot_v6_institutional.py

      - name: Push Final Checkpoint & Log for Next Session
        if: always()
        run: |
          git config user.name "QuantBot-V6"
          git config user.email "quantbot-v6@users.noreply.github.com"
          git add checkpoint_v6.json hasil_v6_quant.txt || true
          git diff --staged --quiet || git commit -m "🔄 [ESTAFET SESI V6] Auto-save checkpoint & log"
          git pull --rebase origin main || true
          git push origin HEAD || true
